<body>
<div id="overlay">
  <h1>SHERPA &mdash; FIRST LIGHT</h1>
  <p>A voice-led moment in a Himalayan dusk. You enter in darkness; your guide
     greets you. Pinch to open your eyes, light a lamp for safe passage, and
     look through glowing windows into memories of the trail.</p>
  <button id="enter" disabled>Enter VR</button>
  <div id="xrmessage">checking WebXR&hellip;</div>

<script type="module">
import * as THREE from 'three';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

/* ==================================================================
   Sherpa — Scene 1: "First Light" v2 — procedural 3D dusk world.
   Fresh build 2026-10-06/07. Everything is rendered geometry: crisp at
   any distance. 360 footage appears ONLY as flat memory-portal windows.
   Hand rules (hand-feel-polish-guide.md):
   - runtime selectstart/selectend = the click; manual pinch-distance
     (25mm engage / 35mm release + 90ms debounce) drives rings ONLY
   - targets >= 22mm, three-beat feedback, first pinch <= 10s
   - NEVER palm pinch (system-reserved on both hands)
   ================================================================== */
const T = {
  PINCH_ON_MM: 25, PINCH_OFF_MM: 35, DEBOUNCE_MS: 90,
  RING_FILL_START_MM: 60,
  RAY_FREEZE_MS: 120, DOUBLE_FIRE_GUARD_MS: 150,
  HAND_FADE_MS: 180,
  CAPTION_DIST_M: 1.2,
  REACH_M: 0.45,
  FADEUP_MS: 1200,
  HOLD_S: 1.5,
};

/* ==================================================================
   Renderer / scene / camera / lights
   ================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');   // seated
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060c);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 160);
scene.add(camera);

const hemi = new THREE.HemisphereLight(0x8a7bb8, 0x1a1410, 0.55);
scene.add(hemi);

/* ==================================================================
   Dusk sky dome — shader gradient (indigo zenith -> amber horizon)
   with a low sun glow in the forward (-Z) direction.
   ================================================================== */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec3 vDir;
    void main() {
      float h = clamp(vDir.y, -0.05, 1.0);
      vec3 zen = vec3(0.030, 0.045, 0.130);
      vec3 mid = vec3(0.200, 0.130, 0.310);
      vec3 hor = vec3(0.930, 0.500, 0.220);
      vec3 col = mix(hor, mid, smoothstep(0.0, 0.28, h));
      col = mix(col, zen, smoothstep(0.22, 0.85, h));
      vec3 sunDir = normalize(vec3(0.0, 0.06, -1.0));
      float s = max(dot(normalize(vDir), sunDir), 0.0);
      col += vec3(1.0, 0.55, 0.25) * pow(s, 20.0) * 0.55;
      col += vec3(1.0, 0.72, 0.42) * pow(s, 300.0) * 1.1;
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 32, 24), skyMat));

/* Stars — fade in after the eyes open */
const starGeo = new THREE.BufferGeometry();
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.85);
    const r = 80;
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) + 6;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const starMat = new THREE.PointsMaterial({
  color: 0xcfd8ff, size: 0.35, sizeAttenuation: true,
  transparent: true, opacity: 0, depthWrite: false, fog: false
});
scene.add(new THREE.Points(starGeo, starMat));

/* ==================================================================
   Mountain ridges — fractal silhouettes on canvas, wrapped on
   BackSide cylinders with alphaTest cutout (crisp, correctly sorted).
   Near = dark, far = hazy violet. Farthest layer gets alpenglow snow.
   ================================================================== */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function ridgeTexture(w, h, seed, baseY, amp, color, snowColor) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const rnd = mulberry32(seed);
  const N = 14;
  let pts = [];
  for (let i = 0; i <= N; i++) pts.push(baseY + (rnd() * 2 - 1) * amp);
  pts[N] = pts[0];                                   // tileable seam
  for (let s = 0; s < 4; s++) {
    const np = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const m = (pts[i - 1] + pts[i]) / 2 + (rnd() * 2 - 1) * amp * Math.pow(0.5, s + 1);
      np.push(m, pts[i]);
    }
    pts = np;
  }
  pts[pts.length - 1] = pts[0];
  const stepX = w / (pts.length - 1);
  g.beginPath(); g.moveTo(0, h);
  pts.forEach((y, i) => g.lineTo(i * stepX, Math.max(8, y)));
  g.lineTo(w, h); g.closePath();
  g.fillStyle = color; g.fill();
  if (snowColor) {                                   // alpenglow snow on the peaks
    g.save(); g.clip();
    const grad = g.createLinearGradient(0, 0, 0, baseY + amp);
    grad.addColorStop(0, snowColor); grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, w, baseY + amp * 1.2);
    g.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}
const RIDGE_W = 2048, RIDGE_H = 512;
const ridgeLayers = [
  { r: 26, hgt: 15, yc: 3.2, seed: 11, baseY: 300, amp: 90,  color: '#171224', snow: null },
  { r: 34, hgt: 18, yc: 3.8, seed: 47, baseY: 290, amp: 110, color: '#2a2038', snow: null },
  { r: 43, hgt: 22, yc: 4.4, seed: 83, baseY: 280, amp: 130, color: '#47335c', snow: null },
  { r: 54, hgt: 27, yc: 5.0, seed: 29, baseY: 270, amp: 150, color: '#5f4470', snow: '#f2b98e' },
];
for (const L of ridgeLayers) {
  const tex = ridgeTexture(RIDGE_W, RIDGE_H, L.seed, L.baseY, L.amp, L.color, L.snow);
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: false, alphaTest: 0.5, side: THREE.BackSide, fog: false
  });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(L.r, L.r, L.hgt, 72, 1, true), mat);
  cyl.position.y = L.yc;
  scene.add(cyl);
}

/* ==================================================================
   Ground — dark dusk earth with a faint winding path toward the portals
   ================================================================== */
{
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(512, 512, 40, 512, 512, 512);
  grad.addColorStop(0, '#181b2c'); grad.addColorStop(0.55, '#0e1120'); grad.addColorStop(1, '#060810');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 1024);
  // faint path: canvas top (-V) maps to forward (-Z) after rotateX(-PI/2)
  g.strokeStyle = 'rgba(122,98,66,0.55)'; g.lineWidth = 54; g.lineCap = 'round';
  g.shadowColor = 'rgba(122,98,66,0.5)'; g.shadowBlur = 34;
  g.beginPath(); g.moveTo(512, 1024);
  g.bezierCurveTo(430, 780, 610, 620, 512, 330);
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(70, 48),
    new THREE.MeshBasicMaterial({ map: tex, fog: false })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
}

/* ==================================================================
   Prayer flags — catenary lines with colored quads, gentle wave
   ================================================================== */
const FLAG_COLORS = ['#2f5fb3', '#e9e4d6', '#c23b2e', '#2e9e5b', '#e8b93c'];
const wavingFlags = [];
function flagLine(a, b, sag, count) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const mid = va.clone().add(vb).multiplyScalar(0.5); mid.y -= sag;
  const curve = new THREE.QuadraticBezierCurve3(va, mid, vb);
  const lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(32));
  scene.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x4a3b28 })));
  for (const end of [va, vb]) {                       // wooden poles
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.018, 0.024, end.y, 10),
      new THREE.MeshBasicMaterial({ color: 0x2c2318 })
    );
    pole.position.set(end.x, end.y / 2, end.z);
    scene.add(pole);
  }
  for (let i = 1; i <= count; i++) {
    const t = i / (count + 1);
    const p = curve.getPoint(t);
    const flag = new THREE.Mesh(
      new THREE.PlaneGeometry(0.062, 0.046),
      new THREE.MeshBasicMaterial({ color: FLAG_COLORS[i % FLAG_COLORS.length], side: THREE.DoubleSide })
    );
    flag.position.copy(p); flag.position.y -= 0.030;
    flag.userData = { baseY: Math.atan2(vb.x - va.x, vb.z - va.z), ph: Math.random() * 6.28 };
    flag.rotation.y = flag.userData.baseY;
    scene.add(flag);
    wavingFlags.push(flag);
  }
}
flagLine([-3.4, 2.75, -2.0], [3.4, 2.95, -2.4], 0.45, 22);
flagLine([-3.1, 2.55, 1.0], [1.8, 2.35, -3.4], 0.40, 18);

/* Camera-attached black fade plane (DARK -> FADEUP).
   depthTest stays ON so nearer interactables (eye marker) punch through. */
const fadeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 1 });
const fadePlane = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), fadeMat);
fadePlane.position.set(0, 0, -0.5);
fadePlane.renderOrder = 50;
camera.add(fadePlane);

/* ==================================================================
   Audio — synth chimes + pre-recorded guide narration + music bed
   ================================================================== */
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function blip(freq, durMs, type = 'triangle', gain = 0.25, when = 0) {
  try {
    const ac = audio(), t = ac.currentTime + when / 1000;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + durMs / 1000);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + durMs / 1000 + 0.02);
  } catch (e) {}
}
const sfxClick  = () => blip(660, 80, 'triangle', 0.28);
const sfxTick   = () => blip(520, 60, 'sine', 0.18);
const sfxOpen   = () => { blip(392, 220, 'sine', 0.20); blip(523, 300, 'sine', 0.16, 120); blip(659, 380, 'sine', 0.12, 240); };
const sfxIgnite = () => { blip(523, 180, 'sine', 0.22); blip(659, 220, 'sine', 0.20, 110); blip(784, 320, 'sine', 0.18, 220); blip(1046, 420, 'sine', 0.12, 330); };

/* Narration: one MP3 per beat, chained defensively (a failure skips ahead). */
const NARR = {};
for (const n of ['a1','a2','a3','a4','a5','a6','a7','a8']) {
  const el = new Audio('audio/' + n + '.mp3');
  el.preload = 'auto';
  NARR[n] = el;
}
let narrTimer = 0;
function stopNarr() {
  for (const k in NARR) { try { NARR[k].pause(); } catch (e) {} }
  if (narrTimer) { clearTimeout(narrTimer); narrTimer = 0; }
}
function playNarr(name, onDone) {
  stopNarr();
  const el = NARR[name];
  const done = () => { el.onended = el.onerror = null; if (onDone) onDone(); };
  try {
    el.onended = done; el.onerror = done;
    el.currentTime = 0;
    const p = el.play();
    if (p && p.catch) p.catch(() => done());
  } catch (e) { done(); }
}
function narrLater(ms, fn) { narrTimer = setTimeout(fn, ms); }

/* Music bed — "Almost in F" by Kevin MacLeod (CC BY 4.0), looped low. */
const musicBed = new Audio('audio/music_bed.mp3');
musicBed.loop = true;
musicBed.volume = 0.14;
musicBed.preload = 'auto';
function startMusic() {
  try { musicBed.currentTime = 0; const p = musicBed.play(); if (p && p.catch) p.catch(() => {}); }
  catch (e) {}
}
function stopMusic() { try { musicBed.pause(); } catch (e) {} }

/* ==================================================================
   Caption line — head-anchored, non-interactive, 1.2m
   ================================================================== */
const capCanvas = document.createElement('canvas'); capCanvas.width = 1024; capCanvas.height = 128;
const capTex = new THREE.CanvasTexture(capCanvas);
const caption = new THREE.Mesh(
  new THREE.PlaneGeometry(0.9, 0.1125),
  new THREE.MeshBasicMaterial({ map: capTex, transparent: true, depthTest: false })
);
caption.renderOrder = 60; caption.visible = false;   // above the fade plane
scene.add(caption);
function setCaption(text) {
  const c = capCanvas.getContext('2d');
  c.clearRect(0, 0, 1024, 128);
  c.font = '44px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0,0,0,0.9)'; c.shadowBlur = 12;
  c.fillStyle = '#fff';
  c.fillText(text, 512, 64);
  capTex.needsUpdate = true;
}
function placeCaption(dy = -0.28) {
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  camera.getWorldPosition(p); camera.getWorldQuaternion(q);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q); fwd.y = 0; fwd.normalize();
  caption.position.copy(p).addScaledVector(fwd, T.CAPTION_DIST_M);
  caption.position.y = p.y + dy;
  caption.quaternion.copy(q);
  caption.visible = true;
}

/* ==================================================================
   "Open your eyes" marker — glowing sphere in the dark (reused for replay)
   ================================================================== */
const eye = new THREE.Group();
const eyeCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.020, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xffe6b0, emissive: 0xc98f1f, roughness: 0.4 })
);
const eyeHit = new THREE.Mesh(
  new THREE.SphereGeometry(0.030, 12, 8),
  new THREE.MeshBasicMaterial({ visible: false })
);
eye.add(eyeCore, eyeHit);
eye.visible = false;
scene.add(eye);

const pulseRing = new THREE.Mesh(
  new THREE.RingGeometry(0.028, 0.033, 48),
  new THREE.MeshBasicMaterial({ color: 0xffe6b0, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthTest: false })
);
pulseRing.renderOrder = 60;
pulseRing.visible = false;
scene.add(pulseRing);

// Pinch-progress ring (manual detector drives this; runtime events do the click)
const progRing = new THREE.Mesh(
  new THREE.RingGeometry(0.040, 0.047, 48),
  new THREE.MeshBasicMaterial({ color: 0xffe1a1, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthTest: false })
);
progRing.renderOrder = 60;
progRing.visible = false;
scene.add(progRing);
let progShown = -1;
function setProg(p) {
  const q = Math.round(p * 40) / 40;
  if (q === progShown) return;
  progShown = q;
  progRing.visible = q > 0.01;
  progRing.geometry.dispose();
  progRing.geometry = new THREE.RingGeometry(0.040, 0.047, 48, 1, Math.PI / 2, Math.max(0.001, q * Math.PI * 2));
}
function placeEyeMarker() {
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  camera.getWorldPosition(p); camera.getWorldQuaternion(q);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q); fwd.y = 0; fwd.normalize();
  eye.position.copy(p).addScaledVector(fwd, T.REACH_M);
  eye.position.y = p.y - 0.10;
  eye.visible = true;
  eyeCore.material.emissive.setHex(0xc98f1f);
  pulseRing.visible = true;
}

/* ==================================================================
   The butter lamp — the ritual interaction (hold 1.5s to ignite)
   ================================================================== */
const lamp = new THREE.Group();
const brassMat = new THREE.MeshStandardMaterial({ color: 0x9a7434, metalness: 0.85, roughness: 0.35 });
const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.022, 0.030, 24), brassMat);
bowl.position.y = -0.015;
const rim = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.006, 12, 32), brassMat);
rim.rotation.x = Math.PI / 2;
const flameMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, emissive: 0x000000, roughness: 0.6 });
const flame = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.035, 16), flameMat);
flame.position.y = 0.030;
const glowCanvas = document.createElement('canvas'); glowCanvas.width = glowCanvas.height = 128;
{
  const g = glowCanvas.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,190,110,0.95)');
  grad.addColorStop(0.4, 'rgba(255,150,60,0.45)');
  grad.addColorStop(1, 'rgba(255,130,40,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
}
const glowTex = new THREE.CanvasTexture(glowCanvas);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, transparent: true, opacity: 0, depthWrite: false,
  blending: THREE.AdditiveBlending
}));
glow.scale.setScalar(0.22);
glow.position.y = 0.035;
const lampLight = new THREE.PointLight(0xffa040, 0, 6, 2);
lampLight.position.y = 0.06;
const lampHit = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 12, 8),
  new THREE.MeshBasicMaterial({ visible: false })
);
lampHit.position.y = 0.01;
lamp.add(bowl, rim, flame, glow, lampLight, lampHit);
lamp.visible = false;
scene.add(lamp);

let lampLit = false, igniteT = 0;
function placeLamp() {
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  camera.getWorldPosition(p); camera.getWorldQuaternion(q);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q); fwd.y = 0; fwd.normalize();
  lamp.position.copy(p).addScaledVector(fwd, T.REACH_M);
  lamp.position.y = p.y - 0.08;
  lamp.quaternion.copy(q);
  lamp.visible = true;
  lamp.scale.setScalar(0.001);
}
function igniteVisual(now) {
  const k = Math.min(1, (now - igniteT) / 1200);
  const ease = 1 - Math.pow(1 - k, 3);
  lampLight.intensity = 2.4 * ease;
  glow.material.opacity = 0.9 * ease * (0.92 + 0.08 * Math.sin(now / 160));
  flameMat.emissive.setHex(0xff7722);
  flameMat.emissiveIntensity = 2.2 * ease;
  flameMat.color.setHex(0xffd9a0);
  flame.scale.set(1 + 0.15 * ease, 1 + 0.35 * ease, 1 + 0.15 * ease);
}
function resetLamp() {
  lampLit = false;
  lampLight.intensity = 0;
  glow.material.opacity = 0;
  flameMat.emissive.setHex(0x000000);
  flameMat.emissiveIntensity = 0;
  flameMat.color.setHex(0x2b2b2b);
  flame.scale.setScalar(1);
}

/* ==================================================================
   Memory portals — glowing rings holding LIVE flat video windows.
   Flat 16:9 planes: sharp. Never wrapped on a sphere in this scene.
   ================================================================== */
const portals = [];
function makePortal(videoSrc, narr, x, z) {
  const grp = new THREE.Group();
  grp.position.set(x, 1.35, z);
  grp.lookAt(0, 1.35, 0);
  const frameMat = new THREE.MeshStandardMaterial({
    color: 0x8a6a2f, metalness: 0.8, roughness: 0.35,
    emissive: 0xff9a3c, emissiveIntensity: 0.35
  });
  const frame = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.028, 14, 56), frameMat);
  const v = document.createElement('video');
  v.src = videoSrc; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
  const tex = new THREE.VideoTexture(v);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.repeat.set(0.5625, 1); tex.offset.set(0.21875, 0);   // center-square sample, no distortion
  const win = new THREE.Mesh(
    new THREE.CircleGeometry(0.315, 48),
    new THREE.MeshBasicMaterial({ map: tex })
  );
  win.position.z = 0.005;
  const hit = new THREE.Mesh(
    new THREE.CircleGeometry(0.37, 24),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  hit.position.z = 0.01;
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.016, 0.022, 1.0, 10),
    new THREE.MeshBasicMaterial({ color: 0x2c2318 })
  );
  pole.position.y = -0.85;
  const pl = new THREE.PointLight(0xffb35c, 0, 5, 2);
  pl.position.z = 0.3;
  grp.add(frame, win, hit, pole, pl);
  grp.scale.setScalar(0.001);
  grp.visible = false;
  scene.add(grp);
  const P = { grp, frameMat, hit, video: v, light: pl, narr, popT: 0, revealed: false };
  portals.push(P);
  return P;
}
makePortal('portals/portal_terai.mp4', 'a7', -0.95, -1.35);
makePortal('portals/portal_roadside.mp4', 'a8', 0.95, -1.35);
function startPortalVideos() {
  for (const P of portals) { try { P.video.play().catch(() => {}); } catch (e) {} }
}
function stopPortalVideos() {
  for (const P of portals) { try { P.video.pause(); } catch (e) {} }
}

/* ==================================================================
   Photo gallery — the user's own Nepal frames, large and luminous.
   Stills are perfectly sharp in VR: the crispness anchor of the scene.
   ================================================================== */
const prints = [];
const texLoader = new THREE.TextureLoader();
function makePrint(src, x, z) {
  const grp = new THREE.Group();
  grp.position.set(x, 0, z);
  grp.lookAt(0, 1.35, 0);
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.015, 0.02, 1.02, 10),
    new THREE.MeshBasicMaterial({ color: 0x241d12 })
  );
  pole.position.y = 0.51;
  const glowBack = new THREE.Mesh(
    new THREE.PlaneGeometry(1.00, 0.70),
    new THREE.MeshBasicMaterial({ color: 0x6b4f1f })
  );
  glowBack.position.y = 1.35; glowBack.position.z = -0.012;
  const back = new THREE.Mesh(
    new THREE.PlaneGeometry(0.96, 0.66),
    new THREE.MeshBasicMaterial({ color: 0x0b0b0e })
  );
  back.position.y = 1.35; back.position.z = -0.006;
  const tex = texLoader.load(src);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const photo = new THREE.Mesh(
    new THREE.PlaneGeometry(0.90, 0.60),
    new THREE.MeshBasicMaterial({ map: tex })
  );
  photo.position.y = 1.35;
  grp.add(pole, glowBack, back, photo);
  grp.scale.setScalar(0.001);
  grp.visible = false;
  scene.add(grp);
  prints.push(grp);
}
makePrint('photos/photo_flags.jpg', -1.75, -0.55);
makePrint('photos/photo_valley.jpg', 1.75, -0.55);
makePrint('photos/photo_terrace.jpg', -1.25, 1.65);

/* ==================================================================
   Hands — models, rays, reticle, fade protocol
   ================================================================== */
const handFactory = new XRHandModelFactory();
const hands = [null, null];
const tmpV1 = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpV3 = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();
const NEG_Z = new THREE.Vector3(0, 0, -1);

function makeHandSlot(i) {
  const controller = renderer.xr.getController(i);
  const handObj = renderer.xr.getHand(i);
  const state = {
    controller, handObj, hand: null, handedness: '?', model: null,
    ray: new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
      new THREE.LineBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.45 })
    ),
    reticle: new THREE.Mesh(
      new THREE.SphereGeometry(0.008, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0x88bbff })
    ),
    hoverTarget: null,          // 'eye' | 'lamp' | 'portal0' | 'portal1' | null
    frozenO: new THREE.Vector3(), frozenD: new THREE.Vector3(), frozenUntil: 0,
    pinch: false, pendingPinch: false, pendingSince: 0,
    fade: 1, fading: 'none',
  };
  state.ray.scale.z = 4; state.reticle.visible = false;
  scene.add(state.ray, state.reticle);
  controller.addEventListener('connected', (e) => onConnected(i, e));
  controller.addEventListener('disconnected', () => onDisconnected(i));
  controller.addEventListener('selectstart', () => onSelectStart(i));
  controller.addEventListener('selectend', () => onSelectEnd(i));
  scene.add(controller, handObj);
  return state;
}

function onConnected(i, e) {
  const s = hands[i]; if (!s) return;
  s.hand = e.data.hand || null; s.handedness = e.data.handedness || '?';
  if (s.hand && !s.model) {
    s.model = handFactory.createHandModel(s.handObj, 'mesh');
    s.handObj.add(s.model);
  }
  if (s.model) s.model.visible = true;
  s.fade = 0; s.fading = 'in'; s.ray.visible = true;
  dbg(`hand connected: ${s.handedness}`);
}
function onDisconnected(i) {
  const s = hands[i]; if (!s) return;
  s.fading = 'out'; s.hoverTarget = null;
}

/* ---- discrete selection: runtime events ONLY ---- */
let lastSelectAt = 0;
let selectedName = null;   // which target the current press began on
function portalHitActive() {
  return flow === Flow.REVEAL || flow === Flow.END;
}
function onSelectStart(i) {
  const s = hands[i]; if (!s) return;
  const now = performance.now();
  if (now - lastSelectAt < T.DOUBLE_FIRE_GUARD_MS) return;
  const hov = s.hoverTarget;
  const eyeOk = (flow === Flow.DARK || flow === Flow.END) && hov === 'eye' && eye.visible;
  const portalOk = portalHitActive() && (hov === 'portal0' || hov === 'portal1');
  if (!eyeOk && !portalOk) return;
  lastSelectAt = now;
  selectedName = eyeOk ? 'eye' : hov;
  sfxClick();
  s.controller.getWorldPosition(s.frozenO); rayDir(s.controller, s.frozenD);
  s.frozenUntil = now + T.RAY_FREEZE_MS;
  if (eyeOk) {
    eyeCore.position.z -= 0.007;
    eyeCore.material.emissive.setHex(0xe8b04a);
  } else {
    const P = portals[hov === 'portal0' ? 0 : 1];
    P.popT = now;
    P.frameMat.emissiveIntensity = 1.4;
    playNarr(P.narr);
  }
}
function onSelectEnd(i) {
  const s = hands[i]; if (!s) return;
  eyeCore.position.z = 0;
  if (selectedName === 'eye' && eye.visible &&
      (flow === Flow.DARK || flow === Flow.END)) {
    selectedName = null;
    if (flow === Flow.DARK) openEyes();
    else resetScene();
  } else selectedName = null;
}

function rayDir(controller, out) {
  controller.getWorldQuaternion(tmpQ);
  return out.copy(NEG_Z).applyQuaternion(tmpQ);
}

/* ---- manual pinch distance: rings ONLY (validated 25/35mm + 90ms) ---- */
function pinchDistMm(s) {
  if (!s.hand || !s.handObj.joints) return -1;
  const a = s.handObj.joints['index-finger-tip'], b = s.handObj.joints['thumb-tip'];
  if (!a || !b) return -1;
  a.getWorldPosition(tmpV1); b.getWorldPosition(tmpV2);
  return tmpV1.distanceTo(tmpV2) * 1000;
}
function updatePinch(s, now) {
  const d = pinchDistMm(s);
  if (d < 0) return;
  const target = s.pinch ? d < T.PINCH_OFF_MM : d < T.PINCH_ON_MM;
  if (target !== s.pendingPinch) { s.pendingPinch = target; s.pendingSince = now; }
  if (s.pendingPinch !== s.pinch && now - s.pendingSince > T.DEBOUNCE_MS) s.pinch = s.pendingPinch;
}

/* ---- hover via raycast against active targets ---- */
const raycaster = new THREE.Raycaster();
function updateHover(s, now) {
  let o, d;
  if (now < s.frozenUntil) { o = s.frozenO; d = s.frozenD; }
  else {
    s.controller.getWorldPosition(tmpV1); rayDir(s.controller, tmpV2);
    o = tmpV1; d = tmpV2;
    s.ray.position.copy(o);
    tmpQ.setFromUnitVectors(NEG_Z, d);
    s.ray.quaternion.copy(tmpQ);
  }
  raycaster.set(o, d); raycaster.far = 5;
  let target = null;
  if ((flow === Flow.DARK || flow === Flow.END) && eye.visible) {
    const hits = raycaster.intersectObject(eyeHit, false);
    if (hits.length > 0) target = { name: 'eye', point: hits[0].point };
  }
  if (!target && flow === Flow.LAMP && lamp.visible && !lampLit) {
    const hits = raycaster.intersectObject(lampHit, false);
    if (hits.length > 0) target = { name: 'lamp', point: hits[0].point };
  }
  if (!target && portalHitActive()) {
    for (let pi = 0; pi < portals.length; pi++) {
      if (!portals[pi].revealed) continue;
      const hits = raycaster.intersectObject(portals[pi].hit, false);
      if (hits.length > 0) { target = { name: 'portal' + pi, point: hits[0].point }; break; }
    }
  }
  const name = target ? target.name : null;
  if (name !== s.hoverTarget) {
    s.hoverTarget = name;
    // hover beat: glow + reticle tint
    if (name === 'eye') { eyeCore.material.emissive.setHex(0xe8b04a); s.reticle.material.color.setHex(0xffc861); }
    else eyeCore.material.emissive.setHex(0xc98f1f);
    if (name === 'lamp') { flameMat.emissive.setHex(0x331a08); s.reticle.material.color.setHex(0xffb35c); }
    else if (!lampLit) flameMat.emissive.setHex(0x000000);
    if (name && name.startsWith('portal')) {
      const P = portals[name === 'portal0' ? 0 : 1];
      P.frameMat.emissiveIntensity = 0.8;
      s.reticle.material.color.setHex(0xffc861);
    } else {
      for (const P of portals) if (performance.now() - P.popT > 900) P.frameMat.emissiveIntensity = 0.35;
    }
    if (!name) s.reticle.material.color.setHex(0x88bbff);
  }
  if (target) {
    s.reticle.visible = true;
    s.reticle.position.copy(target.point);
    s.reticle.scale.setScalar(1.35);
  } else s.reticle.visible = false;
}
function anyHoverLamp() { return hands.some(s => s && s.hoverTarget === 'lamp'); }
function anyHoverEye() { return hands.some(s => s && s.hoverTarget === 'eye'); }

/* ---- desktop fallback: click = pinch, press-hold = lamp hold ---- */
let desktopHold = false;
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (renderer.xr.isPresenting) return;
  tmpV3.set((e.clientX / innerWidth) * 2 - 1, -((e.clientY / innerHeight) * 2 - 1), 0.5).unproject(camera);
  raycaster.set(camera.position, tmpV3.sub(camera.position).normalize()); raycaster.far = 6;
  if ((flow === Flow.DARK || flow === Flow.END) && eye.visible &&
      raycaster.intersectObject(eyeHit, false).length > 0) {
    sfxClick();
    if (flow === Flow.DARK) openEyes(); else resetScene();
    return;
  }
  if (portalHitActive()) {
    for (let pi = 0; pi < portals.length; pi++) {
      if (!portals[pi].revealed) continue;
      if (raycaster.intersectObject(portals[pi].hit, false).length > 0) {
        sfxClick();
        portals[pi].popT = performance.now();
        portals[pi].frameMat.emissiveIntensity = 1.4;
        playNarr(portals[pi].narr);
        return;
      }
    }
  }
  if (flow === Flow.LAMP && lamp.visible && !lampLit &&
      raycaster.intersectObject(lampHit, false).length > 0) {
    desktopHold = true;
  }
});
addEventListener('pointerup', () => { desktopHold = false; });

/* ==================================================================
   Scene flow: DARK -> FADEUP -> WORLD -> LAMP -> IGNITE -> REVEAL -> END
   ================================================================== */
const Flow = { DARK: 0, FADEUP: 1, WORLD: 2, LAMP: 3, IGNITE: 4, REVEAL: 5, END: 6 };
let flow = Flow.DARK;
let fadeT = 0, revealT = 0;
let holdT = 0;

function openEyes() {
  flow = Flow.FADEUP; fadeT = performance.now();
  sfxOpen();
  setCaption('');
  eye.visible = false; pulseRing.visible = false; setProg(0);
}

function showLamp() {
  if (flow !== Flow.WORLD) return;
  flow = Flow.LAMP;
  resetLamp();
  placeLamp();
  playNarr('a4');
}

function igniteLamp() {
  if (flow !== Flow.LAMP || lampLit) return;
  flow = Flow.IGNITE; igniteT = performance.now();
  lampLit = true;
  setProg(0);
  sfxIgnite();
  hemi.intensity = 0.75;                       // the world brightens with the flame
  playNarr('a5', () => narrLater(1500, revealWorld));
}

function revealWorld() {
  if (flow !== Flow.IGNITE) return;
  flow = Flow.REVEAL; revealT = performance.now();
  for (const P of portals) { P.grp.visible = true; P.revealed = true; }
  for (const pr of prints) pr.visible = true;
  setCaption('Moments frozen in light.');
  placeCaption();
  playNarr('a6', showEnding);
}

function showEnding() {
  flow = Flow.END;
  setCaption('The trail is waiting.');
  placeCaption();
  placeEyeMarker();
}

function resetScene() {
  stopNarr();
  flow = Flow.DARK;
  fadeMat.opacity = 1;
  starMat.opacity = 0;
  hemi.intensity = 0.55;
  lamp.visible = false;
  resetLamp();
  for (const P of portals) { P.grp.visible = false; P.revealed = false; P.grp.scale.setScalar(0.001); P.frameMat.emissiveIntensity = 0.35; P.light.intensity = 0; P.popT = 0; }
  for (const pr of prints) { pr.visible = false; pr.scale.setScalar(0.001); }
  holdT = 0; setProg(0);
  setCaption('Pinch to open your eyes.');
  placeCaption();
  placeEyeMarker();
  startMusic();
  startPortalVideos();
  playNarr('a1');
}

/* ==================================================================
   Frame loop
   ================================================================== */
const clock = new THREE.Clock();
function easeOut(k) { return 1 - Math.pow(1 - k, 3); }
function animate() {
  const now = performance.now();
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = now / 1000;

  // DARK -> WORLD: 1.2s fade from black, stars fade in
  if (flow === Flow.FADEUP) {
    const k = Math.min(1, (now - fadeT) / T.FADEUP_MS);
    fadeMat.opacity = 1 - k;
    starMat.opacity = k * 0.9;
    if (k >= 1) {
      flow = Flow.WORLD;
      playNarr('a2', () => narrLater(1500, () => playNarr('a3', showLamp)));
    }
  }

  // prayer flags wave
  for (const f of wavingFlags) {
    f.rotation.y = f.userData.baseY + Math.sin(t * 2.2 + f.userData.ph) * 0.30;
    f.rotation.x = Math.sin(t * 3.1 + f.userData.ph * 1.7) * 0.12;
  }

  // invitation pulse on the eye marker
  if (eye.visible && (flow === Flow.DARK || flow === Flow.END)) {
    const p = (Math.sin(now / 450) + 1) / 2;
    const pr = 0.028 + p * 0.010;
    pulseRing.geometry.dispose();
    pulseRing.geometry = new THREE.RingGeometry(pr, pr + 0.005, 48);
    pulseRing.material.opacity = 0.35 + p * 0.45;
    pulseRing.position.copy(eye.position);
    pulseRing.quaternion.copy(camera.quaternion);
    eye.position.y += Math.sin(now / 900) * 0.00012;
  }

  // lamp grows in when placed
  if (lamp.visible && lamp.scale.x < 1 && flow === Flow.LAMP) {
    lamp.scale.setScalar(Math.min(1, lamp.scale.x + dt * 2.5));
  }
  // ignite bloom + living flicker
  if (lampLit && (flow === Flow.IGNITE || flow === Flow.REVEAL || flow === Flow.END)) igniteVisual(now);

  // lamp hold: pinch-and-hold 1.5s (manual detector + hover)
  if (flow === Flow.LAMP && lamp.visible && !lampLit) {
    const holding = hands.some(s => s && s.pinch && s.hoverTarget === 'lamp') || desktopHold;
    if (holding) {
      if (holdT === 0) sfxTick();
      holdT += dt;
      progRing.position.copy(lamp.position); progRing.position.y += 0.01;
      progRing.quaternion.copy(camera.quaternion);
      setProg(Math.min(1, holdT / T.HOLD_S));
      if (holdT >= T.HOLD_S) igniteLamp();
    } else {
      holdT = Math.max(0, holdT - dt * 2);
      if (holdT > 0) {
        progRing.position.copy(lamp.position); progRing.position.y += 0.01;
        progRing.quaternion.copy(camera.quaternion);
        setProg(holdT / T.HOLD_S);
      } else if (progShown !== 0 && !anyHoverLamp()) setProg(0);
    }
    if (!holding && anyHoverLamp()) {
      progRing.position.copy(lamp.position); progRing.position.y += 0.01;
      progRing.quaternion.copy(camera.quaternion);
    }
  }

  // eye-marker proximity ring (momentary pinch affordance)
  if ((flow === Flow.DARK || flow === Flow.END) && eye.visible) {
    let best = -1;
    for (const s of hands) {
      if (!s || !s.hand) continue;
      const d = pinchDistMm(s);
      if (d < 0) continue;
      if (s.hoverTarget === 'eye' && d < T.RING_FILL_START_MM) {
        const prog = 1 - Math.min(1, Math.max(0, (d - T.PINCH_ON_MM) / (T.RING_FILL_START_MM - T.PINCH_ON_MM)));
        best = d;
        progRing.position.copy(eye.position);
        progRing.quaternion.copy(camera.quaternion);
        setProg(prog);
      }
    }
    if (best < 0 && progShown !== 0 && !anyHoverEye()) setProg(0);
  }

  // REVEAL: portals + prints grow in, portal glow lights fade up
  if (flow === Flow.REVEAL || flow === Flow.END) {
    const k = easeOut(Math.min(1, (now - revealT) / 900));
    for (const P of portals) {
      P.grp.scale.setScalar(Math.max(0.001, k));
      P.light.intensity = 0.7 * k;
    }
    for (const pr of prints) pr.scale.setScalar(Math.max(0.001, k));
  }
  // portal pinch pop (relative to the current reveal scale — no compounding)
  for (const P of portals) {
    if (!P.popT) continue;
    const pk = (now - P.popT) / 900;
    if (pk >= 1) { P.popT = 0; P.frameMat.emissiveIntensity = 0.35; continue; }
    const base = (flow === Flow.REVEAL) ? easeOut(Math.min(1, (now - revealT) / 900)) : 1;
    P.grp.scale.setScalar(Math.max(0.001, base * (1 + Math.sin(pk * Math.PI) * 0.06)));
  }

  // captions stay head-anchored
  if (caption.visible) caption.quaternion.copy(camera.quaternion);

  for (const s of hands) {
    if (!s) continue;
    if (s.fading === 'out') {
      s.fade = Math.max(0, s.fade - dt * 1000 / T.HAND_FADE_MS);
      if (s.model) s.model.visible = s.fade > 0.02;
      if (s.fade === 0) { s.fading = 'done'; s.ray.visible = false; s.reticle.visible = false; }
    } else if (s.fading === 'in') {
      s.fade = Math.min(1, s.fade + dt * 1000 / T.HAND_FADE_MS);
      if (s.model) s.model.visible = true;
      if (s.fade === 1) { s.fading = 'none'; s.ray.visible = true; }
    }
    if (s.model) s.model.traverse(o => { if (o.material) { o.material.transparent = true; o.material.opacity = s.fade; } });
    if (s.hand && s.fade > 0.5 && renderer.xr.isPresenting) {
      updatePinch(s, now);
      updateHover(s, now);
    }
  }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* ==================================================================
   Session bootstrap
   ================================================================== */
const overlay = document.getElementById('overlay');
const enterBtn = document.getElementById('enter');
const xrmsg = document.getElementById('xrmessage');
const dbgDiv = document.getElementById('dbg');
function dbg(m) { dbgDiv.style.display = 'block'; dbgDiv.innerHTML += m + '<br>'; }

hands[0] = makeHandSlot(0); hands[1] = makeHandSlot(1);

if ('xr' in navigator) {
  navigator.xr.isSessionSupported('immersive-vr').then((ok) => {
    if (ok) {
      xrmsg.textContent = 'WebXR immersive-vr supported. Hands will be requested.';
      enterBtn.disabled = false;
    } else xrmsg.textContent = 'immersive-vr NOT supported in this browser. Open this page in the Quest Browser.';
  });
} else xrmsg.textContent = 'WebXR not available. Open this page in the Quest Browser.';

enterBtn.addEventListener('click', async () => {
  audio();   // unlock AudioContext on user gesture
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['hand-tracking', 'local-floor']
    });
    renderer.xr.setSession(session);
    overlay.style.display = 'none';
    const waitForPose = setInterval(() => {
      if (renderer.xr.isPresenting) {
        clearInterval(waitForPose);
        resetScene();   // DARK + a1 + "Pinch to open your eyes."
      }
    }, 100);
    setTimeout(() => clearInterval(waitForPose), 5000);
    session.addEventListener('end', () => {
      overlay.style.display = 'flex';
      stopNarr();
      stopMusic();
      stopPortalVideos();
      flow = Flow.DARK; fadeMat.opacity = 1; starMat.opacity = 0;
    });
    dbg('session started');
  } catch (e) { xrmsg.textContent = 'Session failed: ' + e.message; }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
