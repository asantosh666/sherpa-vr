<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sherpa — Scene 1: Arrival</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
               font-family: system-ui, -apple-system, sans-serif; color:#eee; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; text-align:center; padding:24px; z-index:10; background:#0b0d10; }
  #overlay h1 { font-size:28px; margin:0 0 12px; font-weight:600; }
  #overlay p { max-width:520px; line-height:1.5; color:#bbb; }
  #enter { margin-top:20px; padding:16px 48px; font-size:20px; border:none; border-radius:12px;
           background:#c8862a; color:#fff; cursor:pointer; }
  #enter:disabled { background:#555; cursor:default; }
  #dbg { position:absolute; top:12px; left:12px; font-size:13px; color:#888; z-index:5;
         background:rgba(0,0,0,.45); padding:8px 12px; border-radius:8px; display:none;
         max-width:60ch; }
  canvas { display:block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="overlay">
  <h1>Sherpa — Scene 1: Arrival</h1>
  <p>A highland plain in Nepal. Travelers approach on the trail.<br>
     Put on the Quest, enter VR, and pinch the glowing trail marker.<br>
     <span id="xrmessage">Checking WebXR support…</span></p>
  <button id="enter" disabled>Enter VR</button>
</div>
<div id="dbg"></div>

<script type="module">
import * as THREE from 'three';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

/* ==================================================================
   Tunables — from sherpa/hand-feel-polish-guide.md
   - Pinch SELECT: runtime selectstart/selectend ONLY (OS-tuned).
   - Manual joint-distance math: progress-ring feedback ONLY.
   ================================================================== */
const T = {
  PINCH_ON_MM: 25, PINCH_OFF_MM: 35,   // hysteresis band, manual detector
  DEBOUNCE_MS: 90,                     // reading must persist this long
  RING_FILL_START_MM: 90,              // ring starts filling at 9cm
  MARKER_DIST_M: 0.45,                 // poke range, dead-center, slightly low
  MARKER_VIS_R: 0.015, MARKER_HIT_R: 0.030,  // visual < collider (4-6dp padding rule)
  RAY_FREEZE_MS: 120,                  // freeze ray after selectstart (pinch jitter)
  HAND_FADE_MS: 180,
  DOUBLE_FIRE_GUARD_MS: 150,
  CAPTION_DIST_M: 1.2,
};

/* ==================================================================
   Renderer / scene / camera
   ================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');   // seated
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 60);

// Soft ambient so hand meshes read against the video sphere
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x20242a, 0.7));

/* ==================================================================
   360 video sphere (equirectangular)
   ================================================================== */
const vid = document.createElement('video');
vid.src = 'scene1-044-360.mp4';
vid.preload = 'auto';
vid.playsInline = true;
vid.loop = false;

const vidTex = new THREE.VideoTexture(vid);
vidTex.colorSpace = THREE.SRGBColorSpace;
// Yaw-align: travelers sit at u≈0.616 in the equirect; three.js maps world -Z
// to u=0.75, so offset.x = 0.616-0.75 centers the action on initial forward.
vidTex.wrapS = THREE.RepeatWrapping;
vidTex.offset.x = -0.134;
const sphereMat = new THREE.MeshBasicMaterial({ map: vidTex, side: THREE.BackSide });
sphereMat.color.setHex(0x000000);   // start black; fades up on "begin"
const videoSphere = new THREE.Mesh(new THREE.SphereGeometry(10, 64, 48), sphereMat);
scene.add(videoSphere);

/* ==================================================================
   Audio — tiny synth for UI feedback (video carries its own ambience)
   ================================================================== */
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function blip(freq, durMs, type = 'triangle', gain = 0.25, when = 0) {
  try {
    const ac = audio(), t = ac.currentTime + when / 1000;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + durMs / 1000);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + durMs / 1000 + 0.02);
  } catch (e) {}
}
const sfxClick = () => blip(660, 80, 'triangle', 0.28);                       // commit
const sfxBegin = () => { blip(392, 200, 'sine', 0.20); blip(523, 260, 'sine', 0.18, 110); blip(659, 340, 'sine', 0.14, 220); }; // arrival chime

/* ==================================================================
   Trail marker — the ONE interactive beat of Scene 1
   ================================================================== */
const marker = new THREE.Group();
const markerCore = new THREE.Mesh(
  new THREE.SphereGeometry(T.MARKER_VIS_R, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xffc861, emissive: 0xa86a12, roughness: 0.4 })
);
const markerHit = new THREE.Mesh(
  new THREE.SphereGeometry(T.MARKER_HIT_R, 12, 8),
  new THREE.MeshBasicMaterial({ visible: false })
);
marker.add(markerCore, markerHit);
marker.userData.hit = markerHit;
scene.add(marker);

// Invitation pulse ring around the marker
const pulseRing = new THREE.Mesh(
  new THREE.RingGeometry(0.028, 0.033, 48),
  new THREE.MeshBasicMaterial({ color: 0xffc861, transparent: true, opacity: 0.7, side: THREE.DoubleSide })
);
scene.add(pulseRing);

// Pinch-progress ring (manual detector drives this; runtime events do the click)
const progRing = new THREE.Mesh(
  new THREE.RingGeometry(0.040, 0.047, 48),
  new THREE.MeshBasicMaterial({ color: 0xffe1a1, transparent: true, opacity: 0.95, side: THREE.DoubleSide })
);
progRing.visible = false;
scene.add(progRing);
let progShown = -1;
function setProg(p) {
  const q = Math.round(p * 40) / 40;
  if (q === progShown) return;
  progShown = q;
  progRing.visible = q > 0.01;
  progRing.geometry.dispose();
  progRing.geometry = new THREE.RingGeometry(0.040, 0.047, 48, 1, Math.PI / 2, Math.max(0.001, q * Math.PI * 2));
}

/* ==================================================================
   Caption line — head-anchored, non-interactive, 1.2m
   ================================================================== */
const capCanvas = document.createElement('canvas'); capCanvas.width = 1024; capCanvas.height = 128;
const capTex = new THREE.CanvasTexture(capCanvas);
const caption = new THREE.Mesh(
  new THREE.PlaneGeometry(0.9, 0.1125),
  new THREE.MeshBasicMaterial({ map: capTex, transparent: true, depthTest: false })
);
caption.renderOrder = 5; caption.visible = false;
scene.add(caption);
function setCaption(text) {
  const c = capCanvas.getContext('2d');
  c.clearRect(0, 0, 1024, 128);
  c.font = '44px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0,0,0,0.9)'; c.shadowBlur = 12;
  c.fillStyle = '#fff';
  c.fillText(text, 512, 64);
  capTex.needsUpdate = true;
}
function placeCaption() {
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  camera.getWorldPosition(p); camera.getWorldQuaternion(q);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q); fwd.y = 0; fwd.normalize();
  caption.position.copy(p).addScaledVector(fwd, T.CAPTION_DIST_M);
  caption.position.y = p.y - 0.28;   // lower third — out of the sightline, readable
  caption.quaternion.copy(q);
  caption.visible = true;
}

/* ==================================================================
   Scene flow: IDLE -> BEGINNING -> PLAYING -> ENDED(replay)
   ================================================================== */
const Flow = { IDLE: 0, BEGINNING: 1, PLAYING: 2, ENDED: 3 };
let flow = Flow.IDLE;
let fadeT = 0;

function placeMarker() {
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  camera.getWorldPosition(p); camera.getWorldQuaternion(q);
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q); fwd.y = 0; fwd.normalize();
  marker.position.copy(p).addScaledVector(fwd, T.MARKER_DIST_M);
  marker.position.y = p.y - 0.10;    // slightly below eye level, lower = less fatigue
  marker.visible = true;
  marker.scale.setScalar(1);
  markerCore.material.emissive.setHex(0xa86a12);
  pulseRing.visible = true;
}

function beginWalk() {
  flow = Flow.BEGINNING; fadeT = performance.now();
  sfxBegin();
  setCaption('The trail is waiting.');
  // marker dissolves as the world fades up
  pulseRing.visible = false; setProg(0);
}

vid.addEventListener('ended', () => {
  if (flow !== Flow.PLAYING) return;
  flow = Flow.ENDED;
  setCaption('Walk it again — pinch the marker.');
  placeMarker();
});

/* ==================================================================
   Hands — models, rays, reticle, fade protocol
   ================================================================== */
const handFactory = new XRHandModelFactory();
const hands = [null, null];
const tmpV1 = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpV3 = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();
const NEG_Z = new THREE.Vector3(0, 0, -1);

function makeHandSlot(i) {
  const controller = renderer.xr.getController(i);
  const handObj = renderer.xr.getHand(i);
  const state = {
    controller, handObj, hand: null, handedness: '?', model: null,
    ray: new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
      new THREE.LineBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.45 })
    ),
    reticle: new THREE.Mesh(
      new THREE.SphereGeometry(0.008, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0x88bbff })
    ),
    hover: false,
    frozenO: new THREE.Vector3(), frozenD: new THREE.Vector3(), frozenUntil: 0,
    pinch: false, pendingPinch: false, pendingSince: 0,
    fade: 1, fading: 'none',
  };
  state.ray.scale.z = 4; state.reticle.visible = false;
  scene.add(state.ray, state.reticle);
  controller.addEventListener('connected', (e) => onConnected(i, e));
  controller.addEventListener('disconnected', () => onDisconnected(i));
  controller.addEventListener('selectstart', () => onSelectStart(i));
  controller.addEventListener('selectend', () => onSelectEnd(i));
  scene.add(controller, handObj);
  return state;
}

function onConnected(i, e) {
  const s = hands[i]; if (!s) return;
  s.hand = e.data.hand || null; s.handedness = e.data.handedness || '?';
  if (s.hand && !s.model) {
    s.model = handFactory.createHandModel(s.handObj, 'mesh');
    s.handObj.add(s.model);
  }
  if (s.model) s.model.visible = true;
  s.fade = 0; s.fading = 'in'; s.ray.visible = true;
  dbg(`hand connected: ${s.handedness}`);
}
function onDisconnected(i) {
  const s = hands[i]; if (!s) return;
  s.fading = 'out'; s.hover = false;   // fade protocol; world keeps running
  markerCore.position.z = 0;
  dbg(`hand disconnected: ${s.handedness}`);
}

/* ---- discrete selection: runtime events ONLY ---- */
let lastSelectAt = 0;
function onSelectStart(i) {
  const s = hands[i]; if (!s || flow === Flow.BEGINNING || flow === Flow.PLAYING) return;
  const now = performance.now();
  if (s.hover && marker.visible && now - lastSelectAt > T.DOUBLE_FIRE_GUARD_MS) {
    lastSelectAt = now;
    sfxClick();
    // freeze ray origin so the pinch motion can't yank aim (guide §6.1)
    s.controller.getWorldPosition(s.frozenO); rayDir(s.controller, s.frozenD);
    s.frozenUntil = now + T.RAY_FREEZE_MS;
    // press beat: 7mm travel + color shift
    markerCore.position.z -= 0.007;
    markerCore.material.emissive.setHex(0xe09a2a);
  }
}
function onSelectEnd(i) {
  const s = hands[i]; if (!s) return;
  markerCore.position.z = 0;
  if (lastSelectAt && performance.now() - lastSelectAt < 2000 && marker.visible &&
      (flow === Flow.IDLE || flow === Flow.ENDED)) {
    lastSelectAt = 0;
    beginWalk();   // release beat starts synchronously — ≤100ms rule
  }
}

function rayDir(controller, out) {
  controller.getWorldQuaternion(tmpQ);
  return out.copy(NEG_Z).applyQuaternion(tmpQ);
}

/* ---- manual pinch distance: progress-ring ONLY ---- */
function pinchDistMm(s) {
  if (!s.hand || !s.handObj.joints) return -1;
  const a = s.handObj.joints['index-finger-tip'], b = s.handObj.joints['thumb-tip'];
  if (!a || !b) return -1;
  a.getWorldPosition(tmpV1); b.getWorldPosition(tmpV2);
  return tmpV1.distanceTo(tmpV2) * 1000;
}
function updatePinchRing(s, now) {
  const d = pinchDistMm(s);
  if (d < 0 || !marker.visible) { if (progShown !== 0 && !anyHover()) setProg(0); return; }
  const target = s.pinch ? d < T.PINCH_OFF_MM : d < T.PINCH_ON_MM;
  if (target !== s.pendingPinch) { s.pendingPinch = target; s.pendingSince = now; }
  if (s.pendingPinch !== s.pinch && now - s.pendingSince > T.DEBOUNCE_MS) s.pinch = s.pendingPinch;
  if (s.hover) {
    const prog = 1 - Math.min(1, Math.max(0, (d - T.PINCH_ON_MM) / (T.RING_FILL_START_MM - T.PINCH_ON_MM)));
    progRing.position.copy(marker.position);
    progRing.quaternion.copy(camera.quaternion);
    setProg(d < T.RING_FILL_START_MM ? prog : 0);
  } else if (progShown !== 0 && !anyHover()) setProg(0);
}
function anyHover() { return hands.some(s => s && s.hover); }

/* ---- hover via raycast ---- */
const raycaster = new THREE.Raycaster();
function updateHover(s, now) {
  let o, d;
  if (now < s.frozenUntil) { o = s.frozenO; d = s.frozenD; }
  else {
    s.controller.getWorldPosition(tmpV1); rayDir(s.controller, tmpV2);
    o = tmpV1; d = tmpV2;
    s.ray.position.copy(o);
    tmpQ.setFromUnitVectors(NEG_Z, d);
    s.ray.quaternion.copy(tmpQ);
  }
  raycaster.set(o, d); raycaster.far = 5;
  const hits = raycaster.intersectObject(markerHit, false);
  const hit = marker.visible && hits.length > 0;
  if (hit !== s.hover) {
    s.hover = hit;
    if (hit) {  // hover beat: glow + reticle tint
      markerCore.material.emissive.setHex(0xd88f1f);
      s.reticle.material.color.setHex(0xffc861);
    } else {
      markerCore.material.emissive.setHex(0xa86a12);
      s.reticle.material.color.setHex(0x88bbff);
    }
  }
  if (hit) {
    s.reticle.visible = true;
    s.reticle.position.copy(hits[0].point);
    s.reticle.scale.setScalar(1.35);
  } else s.reticle.visible = false;
}

/* ==================================================================
   Frame loop
   ================================================================== */
const clock = new THREE.Clock();
function animate() {
  const now = performance.now();
  const dt = Math.min(clock.getDelta(), 0.1);

  // begin transition: fade video up from black + dissolve marker
  if (flow === Flow.BEGINNING) {
    const k = Math.min(1, (now - fadeT) / 900);
    const v = 1 - k;
    sphereMat.color.setScalar(k);              // black -> full video
    marker.scale.setScalar(Math.max(0.001, v));
    if (k >= 1) {
      marker.visible = false; pulseRing.visible = false;
      flow = Flow.PLAYING;
      vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
    }
  }

  // invitation pulse on the marker
  if (marker.visible && (flow === Flow.IDLE || flow === Flow.ENDED)) {
    const p = (Math.sin(now / 450) + 1) / 2;   // 0..1 gentle pulse
    const pr = 0.028 + p * 0.010;
    pulseRing.geometry.dispose();
    pulseRing.geometry = new THREE.RingGeometry(pr, pr + 0.005, 48);
    pulseRing.material.opacity = 0.35 + p * 0.45;
    pulseRing.position.copy(marker.position);
    pulseRing.quaternion.copy(camera.quaternion);
    marker.position.y += Math.sin(now / 900) * 0.00012;  // gentle bob
  }

  // captions stay head-anchored
  if (caption.visible) caption.quaternion.copy(camera.quaternion);

  for (const s of hands) {
    if (!s) continue;
    if (s.fading === 'out') {
      s.fade = Math.max(0, s.fade - dt * 1000 / T.HAND_FADE_MS);
      if (s.model) s.model.visible = s.fade > 0.02;
      if (s.fade === 0) { s.fading = 'done'; s.ray.visible = false; s.reticle.visible = false; }
    } else if (s.fading === 'in') {
      s.fade = Math.min(1, s.fade + dt * 1000 / T.HAND_FADE_MS);
      if (s.model) s.model.visible = true;
      if (s.fade === 1) { s.fading = 'none'; s.ray.visible = true; }
    }
    if (s.model) s.model.traverse(o => { if (o.material) { o.material.transparent = true; o.material.opacity = s.fade; } });
    if (s.hand && s.fade > 0.5 && renderer.xr.isPresenting) {
      updatePinchRing(s, now);
      updateHover(s, now);
    }
  }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* ==================================================================
   Session bootstrap / desktop fallback
   ================================================================== */
const overlay = document.getElementById('overlay');
const enterBtn = document.getElementById('enter');
const xrmsg = document.getElementById('xrmessage');
const dbgDiv = document.getElementById('dbg');
function dbg(m) { dbgDiv.style.display = 'block'; dbgDiv.innerHTML += m + '<br>'; }

hands[0] = makeHandSlot(0); hands[1] = makeHandSlot(1);

if ('xr' in navigator) {
  navigator.xr.isSessionSupported('immersive-vr').then((ok) => {
    if (ok) {
      xrmsg.textContent = 'WebXR immersive-vr supported. Hands will be requested.';
      enterBtn.disabled = false;
    } else xrmsg.textContent = 'immersive-vr NOT supported in this browser. Open this page in the Quest Browser.';
  });
} else xrmsg.textContent = 'WebXR not available. Open this page in the Quest Browser.';

enterBtn.addEventListener('click', async () => {
  audio();
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['hand-tracking', 'local-floor']
    });
    await renderer.xr.setSession(session);
    overlay.style.display = 'none';
    const waitForPose = setInterval(() => {
      if (renderer.xr.isPresenting) {
        clearInterval(waitForPose);
        placeMarker(); placeCaption();
        setCaption('You\u2019ve arrived. Pinch the glowing marker.');
      }
    }, 100);
    setTimeout(() => clearInterval(waitForPose), 5000);
    session.addEventListener('end', () => {
      overlay.style.display = 'flex';
      try { vid.pause(); } catch (e) {}
      flow = Flow.IDLE; sphereMat.color.setHex(0x000000);
    });
    dbg('session started');
  } catch (e) { xrmsg.textContent = 'Session failed: ' + e.message; }
});

/* Desktop fallback: mouse click = pinch (layout iteration only) */
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (renderer.xr.isPresenting) return;
  if (flow === Flow.BEGINNING || flow === Flow.PLAYING) return;
  tmpV3.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1, 0.5).unproject(camera);
  raycaster.set(camera.position, tmpV3.sub(camera.position).normalize()); raycaster.far = 6;
  if (marker.visible && raycaster.intersectObject(markerHit, false).length > 0) {
    sfxClick(); beginWalk();
  }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
